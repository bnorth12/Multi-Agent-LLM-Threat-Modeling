name: Phase 4 Governance Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"
    - cron: "0 12 1 * *"

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  maintenance:
    name: Weekly and Monthly Governance Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run phase 4 maintenance summary
        run: |
          python scripts/run_phase4_maintenance.py

      - name: Upload phase 4 maintenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase4-governance-maintenance
          path: |
            independent_reviews/latest/phase4_maintenance_latest.md
            independent_reviews/latest/phase4_maintenance_latest.json

      - name: Create recurring maintenance reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const reportPath = 'independent_reviews/latest/phase4_maintenance_latest.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : 'Phase 4 maintenance report was not generated.';

            const dateToken = new Date().toISOString().slice(0, 10);
            const title = `Phase 4 governance maintenance reminder - ${dateToken}`;

            const labelsResponse = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const requested = new Set(['governance', 'phase4-maintenance', 'documentation']);
            const available = labelsResponse.data
              .map((label) => label.name)
              .filter((name) => requested.has(name));

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            if (existing.some((issue) => issue.title === title)) {
              core.info(`Reminder issue already exists: ${title}`);
              return;
            }

            const body = [
              'Automated reminder from scheduled Phase 4 governance maintenance run.',
              '',
              '## Checklist',
              '- [ ] Review latest maintenance report findings',
              '- [ ] Resolve documentation drift findings (if any)',
              '- [ ] Execute archive and cleanup actions for high-churn working artifacts',
              '- [ ] Capture closure evidence in planning/Governance tracker artifacts',
              '',
              '## Latest Report',
              report,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: available,
            });
