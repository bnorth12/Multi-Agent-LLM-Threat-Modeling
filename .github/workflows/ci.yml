name: CI

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run live LLM lane (uses GROK_API secret)"
        required: false
        default: "false"
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    name: Unit tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: tests still import streamlit until GUI separation is complete.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run unit tests (Lane A)
        run: python -m pytest Tests/unit -q --tb=short -m "not llm_live and not llm_live_browser"

  integration-tests:
    name: Integration tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: tests still import streamlit until GUI separation is complete.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run integration tests (Lane A)
        run: python -m pytest Tests/integration -q --tb=short -m "not llm_live and not llm_live_browser"

  e2e-tests-non-live:
    name: E2E tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: full non-live suite still collects tests that import streamlit-backed screens.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run e2e tests (Lane A, non-live only)
        run: python -m pytest Tests/e2e -q --tb=short -m "not llm_live and not llm_live_browser"

  non-live-suite:
    name: Full non-live suite gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests-non-live]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: full non-live suite still collects tests that import streamlit-backed screens.
          pip install streamlit
          pip install pytest openpyxl

      - name: Enforce archive hygiene on changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            python scripts/archive_hygiene.py check --changed-against "origin/${{ github.base_ref }}" --enforce
          else
            python scripts/archive_hygiene.py check --changed-against HEAD~1 --enforce
          fi

      - name: Generate exception remediation proposals
        run: |
          python scripts/validate_cross_domain_exception_policy.py \
            --proposal-only \
            --propose-missing \
            --proposal-out test_reports/cross_domain_exception_proposals.csv

      - name: Enforce cross-domain exception policy gate
        run: python scripts/validate_cross_domain_exception_policy.py

      - name: Run full test suite (Lane A gate)
        run: python -m pytest Tests/ -q --tb=short -m "not llm_live and not llm_live_browser"

  llm-live:
    name: Live LLM tests (Grok API, non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking operational signal lane. Runs on main pushes or manual opt-in dispatch.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live == 'true')
    needs: non-live-suite
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e .

      - name: Run live LLM tests
        env:
          GROK_API: ${{ secrets.GROK_API }}
        run: python -m pytest Tests/ -q --tb=short -m "llm_live"
