name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: tests still import streamlit until GUI separation is complete.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run unit tests (Lane A)
        run: python -m pytest Tests/unit -q --tb=short -m "not llm_live and not llm_live_browser"

  integration-tests:
    name: Integration tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: tests still import streamlit until GUI separation is complete.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run integration tests (Lane A)
        run: python -m pytest Tests/integration -q --tb=short -m "not llm_live and not llm_live_browser"

  e2e-tests-non-live:
    name: E2E tests (non-live)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: full non-live suite still collects tests that import streamlit-backed screens.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run e2e tests (Lane A, non-live only)
        run: python -m pytest Tests/e2e -q --tb=short -m "not llm_live and not llm_live_browser"

  non-live-suite:
    name: Full non-live suite gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests-non-live]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Temporary: full non-live suite still collects tests that import streamlit-backed screens.
          pip install streamlit
          pip install pytest openpyxl

      - name: Run full test suite (Lane A gate)
        run: python -m pytest Tests/ -q --tb=short -m "not llm_live and not llm_live_browser"

  llm-live:
    name: Live LLM tests (Grok API)
    runs-on: ubuntu-latest
    # Only run on pushes to main; skip on PRs from forks (no secret access)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: non-live-suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run live LLM tests
        env:
          GROK_API: ${{ secrets.GROK_API }}
        run: python -m pytest Tests/ -q --tb=short -m "llm_live"
